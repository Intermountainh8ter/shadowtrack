[package]
name = "shadowtrack"
version = "0.1.0"
authors = ["Intermountainh8ter"]
edition = "2021"
license = "MIT"
description = "Shadow-mode behavioral diff for model/prompt/framework upgrades, with pre-registered agreement gate and bootstrap CIs."
repository = "https://github.com/Intermountainh8ter/shadowtrack"
keywords = ["llm", "regression", "shadow-mode", "agent", "upgrade"]
categories = ["command-line-utilities", "science"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rand_pcg = "0.3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[[bin]]
name = "shadowtrack"
path = "src/main.rs"

[lib]
name = "shadowtrack"
path = "src/lib.rs"
